<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Calculator - Redirecting...</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<script>
(function() {
  const defaultLang = 'en';

  const languageMap = {
    'zh': '/zh/index.html',
    'es': '/es/index.html',
    'fr': '/fr/index.html',
    'de': '/de/index.html',
    'ja': '/ja/index.html',
    'ru': '/ru/index.html',
    'pt': '/pt/index.html',
    'ar': '/ar/index.html',
    'hi': '/hi/index.html',
    'bn': '/bn/index.html',
    'it': '/it/index.html',
    'ko': '/ko/index.html',
    'tr': '/tr/index.html',
    'vi': '/vi/index.html',
    'th': '/th/index.html',
    'nl': '/nl/index.html',
    'pl': '/pl/index.html'
  };

  const userLang = (navigator.language || navigator.userLanguage || defaultLang).toLowerCase();
  const mainLang = userLang.split('-')[0];
  const target = languageMap[mainLang] || `/en/index.html`;

  // 检查目标文件是否存在
  fetch(target, { method: 'HEAD' })
    .then(res => {
      if (res.ok) {
        window.location.replace(target);
      } else {
        window.location.replace(`/en/index.html`);
      }
    })
    .catch(() => {
      window.location.replace(`/en/index.html`);
    });

})();
</script>

<style>
body {
  margin: 0;
  padding: 40px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f7fa;
}
.spinner {
  border: 4px solid rgba(0,0,0,0.1);
  border-radius: 50%;
  border-top: 4px solid #3498db;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Redirecting to your preferred language...</p>

    <noscript>
      <p>Please enable JavaScript or select your language manually:</p>
      <ul>
        <li><a href="/en/">English</a></li>
        <li><a href="/zh/">中文</a></li>
        <li><a href="/es/">Español</a></li>
      </ul>
    </noscript>
  </div>
</body>
</html>
