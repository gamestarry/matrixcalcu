<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Calculator - Redirecting...</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script>
  (function() {

    const languageMap = {
    'zh': '/zh/index.html',
    'es': '/es/index.html',
    'fr': '/fr/index.html',
    'de': '/de/index.html',
    'ja': '/ja/index.html',
    'ru': '/ru/index.html',
    'pt': '/pt/index.html',
    'ar': '/ar/index.html',
    'hi': '/hi/index.html',
    'bn': '/bn/index.html',
    'it': '/it/index.html',
    'ko': '/ko/index.html',
    'tr': '/tr/index.html',
    'vi': '/vi/index.html',
    'th': '/th/index.html',
    'nl': '/nl/index.html',
    'pl': '/pl/index.html'
  };

  const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const mainLang = userLang.split('-')[0];
  const langFile = languageMap[mainLang] || '/en/index.html';

  fetch(langFile, { method: 'HEAD' })
    .then(res => {
      if (res.ok) {
        window.location.href = langFile;
      } else {
        window.location.href = '/en/index.html';
      }
    })
    .catch(() => {
      window.location.href = '/en/index.html';
    });

})();
</script>

</head>
<body>
  <p>Redirecting to your preferred language...</p>
  <noscript>
    <p>Please enable JavaScript or select your language manually:</p>
    <ul>
      <li><a href="/en/">English</a></li>
      <li><a href="/zh/">中文</a></li>
      <li><a href="/es/">Español</a></li>
    </ul>
  </noscript>
</body>
</html>
